.chip {

        '</p>' +
        '<ul class="proj-bullets" id="pb-' + p.i + '" hidden>' + p.bullets.map(function (b) { return '<li>' + esc(b) + '</li>'; }).join("") + '</ul>' +
      '</div></li>';
  }

  var projSec =
    '<section class="sec" id="projects" aria-labelledby="h-projects">' +
      '<div class="sec-head"><h2 id="h-projects">Projects</h2><span class="lbl">' + projects.length + ' titles, newest first</span></div>' +
      '<div class="filters">' +
        '<div class="fgroup" role="group" aria-labelledby="fl-genre"><span class="lbl" id="fl-genre">Genre</span><div class="chips">' +
          GENRES.map(function (g) { return chip("genre", g[0], g[1], g[0] === "all" ? projects.length : countBy(function (p) { return p.g === g[0]; })); }).join("") +
        '</div></div>' +
        '<div class="fgroup" role="group" aria-labelledby="fl-plat"><span class="lbl" id="fl-plat">Platform</span><div class="chips">' +
          PLATS.map(function (g) { return chip("plat", g[0], g[1], g[0] === "all" ? projects.length : countBy(function (p) { return p.pl.indexOf(g[0]) > -1; })); }).join("") +
        '</div></div>' +
        '<div class="fgroup"><span class="lbl">Role</span><div class="chips"><label class="toggle" for="f-lead"><input type="checkbox" id="f-lead">Lead or sole role<span class="n">' +
          countBy(function (p) { return p.lead; }) + '</span></label></div></div>' +
      '</div>' +
      '<div class="results">' +
        '<p class="count" id="count" aria-live="polite"></p>' +
        '<div class="results-tools">' +
          '<span class="legend"><span><i class="dot fill"></i>lead or sole</span><span><i class="dot"></i>team role</span></span>' +
          '<button type="button" class="linkbtn" id="reset" hidden>Reset filters</button>' +
          '<button type="button" class="linkbtn" id="expand-all">Expand all</button>' +
        '</div>' +
      '</div>' +
      '<div class="timeline">' +
        studios.map(function (s, si) {
          return '<div class="studio" id="studio-' + si + '">' +
            '<div class="studio-head"><h3>' + esc(s.name) + '</h3><span class="lbl" id="studio-count-' + si + '"></span></div>' +
            '<ol class="proj-list">' + s.items.map(projItem).join("") + '</ol></div>';
        }).join("") +
        '<p class="empty" id="empty" hidden>No projects match these filters.<button type="button" class="linkbtn" id="reset-empty">Reset filters</button></p>' +
      '</div>' +
    '</section>';

  /* ---------- backend case ---------- */
  var B = D.backend_case;
  function parseRange(label) {
    if (!label) return null;
    var m = String(label).match(/([\d.]+)\s*[–-]\s*([\d.]+)/);
    return m ? [parseFloat(m[1]), parseFloat(m[2])] : null;
  }
  function valLabel(v, label, unit) {
    if (label) return /[a-z]/i.test(label) ? label : label + " " + unit;
    return v + " " + unit;
  }
  function barRow(kind, tag, v, label, unit, max) {
    var r = parseRange(label);
    var pct = function (x) { return (x / max * 100).toFixed(2) + "%"; };
    return '<div class="bar-row ' + kind + '"><span class="bar-tag">' + tag + '</span>' +
      '<div class="track" aria-hidden="true"><div class="bar ' + kind + '" style="width:' + pct(v) + '"></div>' +
      (r ? '<div class="whisk" style="left:' + pct(r[0]) + ';width:' + pct(r[1] - r[0]) + '"></div>' : '') +
      '</div><span class="bar-val">' + esc(valLabel(v, label, unit)) + '</span></div>';
  }
  var metrics = B.before_after.map(function (m) {
    var rb = parseRange(m.before_label), ra = parseRange(m.after_label);
    var max = Math.max(m.before, m.after, rb ? rb[1] : 0, ra ? ra[1] : 0);
    return '<li class="metric"><span class="metric-name">' + esc(m.metric) + '</span>' +
      barRow("before", "Before", m.before, m.before_label, m.unit, max) +
      barRow("after", "After", m.after, m.after_label, m.unit, max) + '</li>';
  }).join("");

  var caseSec =
    '<section class="sec" id="backend" aria-labelledby="h-backend">' +
      '<div class="sec-head"><h2 id="h-backend">Backend case study</h2><span class="lbl">' + esc(D.experience[0].dates) + '</span></div>' +
      '<h3 class="case-title">' + esc(B.title) + '</h3>' +
      '<p class="case-text">' + esc(B.process) + '</p>' +
      '<ul class="stack" aria-label="Stack">' + B.stack.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join("") + '</ul>' +
      '<ul class="scale">' + B.scale.map(function (s) {
        return '<li><span class="v">' + esc(s.value) + '</span><span class="l">' + esc(s.label) + '</span></li>';
      }).join("") + '</ul>' +
      '<figure class="chart">' +
        '<figcaption><strong>Before and after optimization</strong>' +
          '<span>Each metric is drawn on its own scale from zero. Where a range was measured, the bar shows its midpoint and the thin line shows the range. Lower is better.</span></figcaption>' +
        '<div class="chart-key" aria-hidden="true"><span><i class="sw before"></i>before</span><span><i class="sw after"></i>after</span><span><i class="sw range"></i>measured range</span></div>' +
        '<ul class="metrics">' + metrics + '</ul>' +
      '</figure>' +
      '<p class="loadtest"><span class="lbl">Load test</span><span>' + esc(B.load_test) + '</span></p>' +
    '</section>';

  /* ---------- experience, skills, languages, education ---------- */
  var expSec =
    '<section class="sec" id="experience" aria-labelledby="h-exp">' +
      '<div class="sec-head"><h2 id="h-exp">Experience</h2></div>' +
      '<ol class="rows">' + D.experience.map(function (e) {
        return '<li class="row"><div class="row-date">' + esc(e.dates) + '</div><div class="row-body">' +
          '<h3 class="row-h">' + esc(e.role) + ' <span class="at">· ' + esc(e.company) + '</span></h3>' +
          '<p>' + esc(e.context) + '</p></div></li>';
      }).join("") + '</ol>' +
    '</section>';

  var skillSec =
    '<section class="sec" id="skills" aria-labelledby="h-skills">' +
      '<div class="sec-head"><h2 id="h-skills">Skills</h2></div>' +
      '<dl class="skills">' + D.skills.map(function (s) {
        return '<dt>' + esc(s[0]) + '</dt><dd>' + esc(s[1]) + '</dd>';
      }).join("") + '</dl>' +
      '<div class="two">' +
        '<div><h3>Languages</h3><ul class="langs">' + D.languages.split(" · ").map(function (l) {
          var parts = l.split(" — ");
          return '<li><span>' + esc(parts[0]) + '</span><span class="lv">' + esc(parts[1] || "") + '</span></li>';
        }).join("") + '</ul></div>' +
        '<div><h3>Education</h3><ul class="edu">' + D.education.map(function (e) {
          return '<li><span class="d">' + esc(e.dates) + '</span><span class="s">' + esc(e.school) + '</span><span class="g">' + esc(e.degree) + '</span></li>';
        }).join("") + '</ul></div>' +
      '</div>' +
    '</section>';

  var foot = '<footer class="foot"><p>' + esc(D.note) + '</p><p>' + esc(D.name) + ' · ' + esc(D.title) + '</p></footer>';

  var app = document.getElementById("app");
  app.innerHTML = hero + projSec + caseSec + expSec + skillSec + foot;

  /* ---------- copy email ---------- */
  var emailEl = document.getElementById("email-text");
  var statusEl = document.getElementById("copy-status");
  function selectEmail() {
    try {
      var r = document.createRange(); r.selectNodeContents(emailEl);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      statusEl.textContent = "Selected, press Ctrl+C";
    } catch (e) { statusEl.textContent = ""; }
  }
  document.getElementById("copy-email").addEventListener("click", function () {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(c.email).then(function () {
          statusEl.textContent = "Copied";
          setTimeout(function () { statusEl.textContent = ""; }, 2500);
        }, selectEmail);
      } else { selectEmail(); }
    } catch (e) { selectEmail(); }
  });

  /* ---------- filters ---------- */
  var st = { genre: "all", plat: "all", lead: false };
  projects.forEach(function (p) {
    p.el = document.getElementById("proj-" + p.i);
    p.btn = document.getElementById("pt-" + p.i);
    p.list = document.getElementById("pb-" + p.i);
  });
  studios.forEach(function (s, si) {
    s.el = document.getElementById("studio-" + si);
    s.countEl = document.getElementById("studio-count-" + si);
  });
  var countEl = document.getElementById("count");
  var emptyEl = document.getElementById("empty");
  var resetBtn = document.getElementById("reset");
  var leadBox = document.getElementById("f-lead");
  var expandBtn = document.getElementById("expand-all");

  function apply() {
    var n = 0;
    projects.forEach(function (p) {
      var ok = (st.genre === "all" || p.g === st.genre) &&
               (st.plat === "all" || p.pl.indexOf(st.plat) > -1) &&
               (!st.lead || p.lead);
      p.el.hidden = !ok;
      if (ok) n++;
    });
    studios.forEach(function (s) {
      var v = s.items.filter(function (p) { return !p.el.hidden; }).length;
      s.el.hidden = v === 0;
      s.countEl.textContent = v === s.items.length ? v + " projects" : v + " of " + s.items.length + " projects";
    });
    countEl.innerHTML = "Showing <b>" + n + "</b> of " + projects.length + " projects";
    emptyEl.hidden = n > 0;
    resetBtn.hidden = st.genre === "all" && st.plat === "all" && !st.lead;
    document.querySelectorAll(".chip").forEach(function (b) {
      b.setAttribute("aria-pressed", String(st[b.dataset.kind] === b.dataset.key));
    });
    leadBox.checked = st.lead;
    syncExpandLabel();
  }
  document.querySelectorAll(".chip").forEach(function (b) {
    b.addEventListener("click", function () { st[b.dataset.kind] = b.dataset.key; apply(); });
  });
  leadBox.addEventListener("change", function () { st.lead = leadBox.checked; apply(); });
  function reset() { st = { genre: "all", plat: "all", lead: false }; apply(); }
  resetBtn.addEventListener("click", reset);
  document.getElementById("reset-empty").addEventListener("click", reset);

  /* ---------- expand / collapse ---------- */
  function setOpen(p, open) {
    p.btn.setAttribute("aria-expanded", String(open));
    p.list.hidden = !open;
    p.el.classList.toggle("is-open", open);
  }
  function visible() { return projects.filter(function (p) { return !p.el.hidden; }); }
  function syncExpandLabel() {
    var v = visible();
    var allOpen = v.length > 0 && v.every(function (p) { return !p.list.hidden; });
    expandBtn.textContent = allOpen ? "Collapse all" : "Expand all";
    expandBtn.hidden = v.length === 0;
  }
  projects.forEach(function (p) {
    p.btn.addEventListener("click", function (ev) {
      ev.stopPropagation();
      setOpen(p, p.list.hidden);
      syncExpandLabel();
    });
    p.el.addEventListener("click", function (ev) {
      if (ev.target.closest("a, button")) return;
      var sel = window.getSelection && window.getSelection();
      if (sel && String(sel).length > 0) return;
      setOpen(p, p.list.hidden);
      syncExpandLabel();
    });
  });
  expandBtn.addEventListener("click", function () {
    var v = visible();
    var open = !v.every(function (p) { return !p.list.hidden; });
    v.forEach(function (p) { setOpen(p, open); });
    syncExpandLabel();
  });

  apply();
})();
</script>

</body>
</html>
