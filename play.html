<style>
/* Layout: one left-aligned console column; output flows down, the prompt and a quick-command strip dock at its end. `play` mounts an ASCII game canvas as a block inside the output. Single dark look by design. */
:root {
  color-scheme: dark;
  --bg: #0d1311;
  --panel: #131b18;
  --line: #24332c;
  --fg: #d3ddd7;
  --dim: #85978d;
  --accent: #1F8B4C;
  --accent-hi: #62d090;
  --on-accent: #020a05;
  --amber: #dcae55;
  --err: #e8907c;
  --bar-before: #4f6359;
  --grid: #1c2924;
  --bug: #cf7f6e;
  --bug-2: #bb7ea8;
  --play-bg: #15281e;
  --scrim: rgba(13, 19, 17, .9);
  --mono: "JetBrains Mono", Consolas, ui-monospace, monospace;
}
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--mono);
  font-size: 15px;
  line-height: 1.6;
}
.wrap {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 40px;
  max-width: 1040px;
}
.sr {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; margin: -1px; padding: 0; border: 0;
}

/* tmux-like status bar */
.bar {
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 16px;
  background: var(--accent); color: var(--on-accent);
  font-size: 13px; font-weight: 700; letter-spacing: .02em;
  padding: 3px 10px;
}
.bar > span { min-width: 0; }
.bar a.back { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
.bar a.back:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }

#term { padding-top: 8px; min-width: 0; }
#out { min-width: 0; overflow-wrap: anywhere; }

.block { margin-top: 18px; min-width: 0; }
.echo { color: var(--fg); white-space: pre-wrap; }
.ps1 { color: var(--accent-hi); font-weight: 500; white-space: nowrap; }
.res { display: grid; gap: 10px; margin-top: 6px; min-width: 0; }
.res > * { min-width: 0; }

.name { color: var(--accent-hi); font-weight: 700; font-size: clamp(1.55rem, 5.2vw, 2.25rem); line-height: 1.15; letter-spacing: -.01em; margin-top: 4px; }
.title { font-weight: 500; }
.dim { color: var(--dim); }
.hd { color: var(--accent-hi); font-weight: 700; text-wrap: balance; }
.hd::before { content: "# "; color: var(--dim); font-weight: 400; }
.sub { color: var(--dim); text-transform: uppercase; letter-spacing: .08em; font-size: 12.5px; margin-top: 4px; }
.para { max-width: 76ch; }
.err { color: var(--err); }
.num { color: var(--amber); font-variant-numeric: tabular-nums; font-weight: 700; }

.stats { display: grid; grid-template-columns: 7ch minmax(0, 1fr); gap: 0 14px; }
.stats .lbl { min-width: 0; }

.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px 20px; }
.kv > .k { color: var(--dim); }
.kv > .v { min-width: 0; }
@media (max-width: 620px) {
  .kv.stack { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .kv.stack > .k { margin-top: 8px; }
  .kv.stack > .k:first-child { margin-top: 0; }
}

.exp { display: grid; grid-template-columns: 22ch minmax(0, 1fr); gap: 2px 20px; }
.exp .when { color: var(--amber); font-variant-numeric: tabular-nums; }
.exp .what { font-weight: 700; }
.exp .ctx { grid-column: 2; max-width: 72ch; }
@media (max-width: 620px) {
  .exp { grid-template-columns: minmax(0, 1fr); }
  .exp .ctx { grid-column: 1; }
}
.list { display: grid; gap: 14px; }

ul.bul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; max-width: 80ch; }
ul.bul li { padding-left: 2ch; text-indent: -2ch; }
ul.bul li::before { content: "- "; color: var(--dim); }

.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { border: 1px solid var(--line); background: var(--panel); padding: 0 8px; }

a { color: var(--accent-hi); text-decoration: underline; text-underline-offset: 3px; }
a:hover { color: var(--fg); }
.cmdlink {
  font: inherit; color: var(--accent-hi); background: none; border: 0; padding: 0; margin: 0;
  cursor: pointer; text-align: left;
  text-decoration: underline dotted; text-underline-offset: 3px;
}
.cmdlink:hover { color: var(--fg); text-decoration-style: solid; }
a:focus-visible, button:focus-visible, .scroll:focus-visible {
  outline: 2px solid var(--accent-hi); outline-offset: 2px;
}

.scroll { overflow-x: auto; max-width: 100%; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; min-width: 44rem; overflow-wrap: normal; font-variant-numeric: tabular-nums; }
th { text-align: left; color: var(--dim); font-weight: 500; border-bottom: 1px solid var(--line); padding: 2px 20px 4px 0; white-space: nowrap; }
td { padding: 3px 20px 3px 0; vertical-align: top; }
td.n { color: var(--amber); }
td.d { white-space: nowrap; color: var(--dim); }
td.dl, th.dl { text-align: right; white-space: nowrap; padding-right: 0; }
td.dl { color: var(--amber); }
tbody tr:hover td { background: var(--panel); }

pre.bars { margin: 0; font: inherit; line-height: 1.5; overflow-wrap: normal; white-space: pre; }
.bar-b { color: var(--bar-before); }
.bar-a { color: var(--accent-hi); }

.copy {
  font: inherit; font-size: 13px; color: var(--fg); background: var(--panel);
  border: 1px solid var(--line); padding: 1px 10px; margin-left: 10px; cursor: pointer;
}
.copy:hover { border-color: var(--accent); color: var(--accent-hi); }
.email { user-select: all; -webkit-user-select: all; color: var(--fg); }
.status { color: var(--accent-hi); margin-left: 10px; }

/* dock: prompt + chips */
#dock { margin-top: 18px; display: grid; gap: 14px; }
.prompt { display: flex; align-items: baseline; gap: 1ch; min-width: 0; padding: 2px 4px; margin: 0 -4px; }
.prompt:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
#cmd {
  flex: 1 1 auto; min-width: 0; width: 100%;
  background: transparent; border: 0; outline: none; padding: 0;
  color: var(--fg); caret-color: var(--accent-hi);
  font: inherit;
}
#cmd::placeholder { color: var(--dim); opacity: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-top: 1px solid var(--line); padding-top: 12px; }
.chips .sub { margin: 0 4px 0 0; }
.chip {
  font: inherit; font-size: 14px; color: var(--fg); background: var(--panel);
  border: 1px solid var(--line); padding: 6px 12px; min-height: 38px; cursor: pointer;
}
.chip::before { content: "$ "; color: var(--dim); }
.chip:hover { border-color: var(--accent); color: var(--accent-hi); }
.chip.play { border-color: var(--accent); background: var(--play-bg); color: var(--accent-hi); font-weight: 700; }
.chip.play::before { content: "▶ "; color: var(--accent-hi); }
.chip.play:hover { color: var(--fg); }

/* game block (mounted inside #out by `play`) */
.glog { display: grid; gap: 4px; min-width: 0; }
.glog:empty { display: none; }
.gch { display: grid; gap: 2px; margin-top: 4px; min-width: 0; }
.gtag { color: var(--amber); font-variant-numeric: tabular-nums; font-weight: 700; }
.gtag.boss { color: var(--bug-2); }
.gname { color: var(--accent-hi); font-weight: 700; }
.gval { color: var(--amber); font-variant-numeric: tabular-nums; }
.gbox { display: grid; gap: 6px; min-width: 0; margin-top: 4px; }
.gbox:focus { outline: none; }
.gbox:focus-visible { outline: 2px solid var(--accent-hi); outline-offset: 3px; }
.gwrap {
  position: relative; width: 100%; aspect-ratio: 16 / 10; max-height: 70vh; min-height: 260px;
  border: 1px solid var(--line); background: var(--bg); overflow: hidden;
}
.gwrap canvas {
  position: absolute; inset: 0; width: 100%; height: 100%; display: block;
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
.gstat { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 12px; font-size: 13px; min-width: 0; }
.gst { white-space: pre-wrap; min-width: 0; font-variant-numeric: tabular-nums; }
.g-hp { color: var(--accent-hi); }
.g-xp { color: var(--amber); }
.gstat .copy { margin-left: 0; min-height: 30px; }
#cmd:disabled { cursor: not-allowed; }

.boot { animation: rise .3s ease-out backwards; animation-delay: calc(var(--i, 0) * 80ms + 60ms); }
@keyframes rise { from { opacity: .15; transform: translateY(3px); } }

@media (max-width: 520px) {
  body { font-size: 14px; }
  #cmd { font-size: 16px; }
  .ps1-host { display: none; }
  .echo .ps1-host { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .boot { animation: none; }
}

/* ---------- tiny DOM helper ---------- */
function h(tag, attrs) {
  var el = document.createElement(tag);
  if (attrs) {
    Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v == null || v === false) return;
      if (k === 'class') el.className = v;
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : String(v));
    });
  }
  var kids = Array.prototype.slice.call(arguments, 2);
  append(el, kids);
  return el;
}
function append(el, kid) {
  if (kid == null || kid === false) return;
  if (Array.isArray(kid)) { kid.forEach(function (k) { append(el, k); }); return; }
  if (typeof kid === 'string' || typeof kid === 'number') el.appendChild(document.createTextNode(String(kid)));
  else el.appendChild(kid);
}

function cmdLink(label, command) {

}
function extLink(label, url) {

function hd(text) { return h('div', { 'class': 'hd' }, text); }

function para(text, cls) { return h('p', { 'class': 'para' + (cls ? ' ' + cls : ''), style: 'margin:0' }, text); }
function kv(rows, cls) {
  var g = h('div', { 'class': 'kv' + (cls ? ' ' + cls : '') });
  rows.forEach(function (r) {
    if (!r) return;

    g.appendChild(h('div', { 'class': 'v' }, r[1]));
  });
  return g;
}
function bullets(items) {

}

function normName(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim(); }
function findProjects(arg) {
  var a = arg.trim().toLowerCase();
  if (/^#?\d+$/.test(a)) {
    var n = parseInt(a.replace('#', ''), 10);
    return CV.projects[n - 1] ? [n - 1] : [];
  }
  var q = normName(a);
  if (!q) return [];
  var idx = CV.projects.map(function (p, i) { return i; });
  var exact = idx.filter(function (i) { return normName(CV.projects[i].name) === q; });
  if (exact.length) return exact;
  return idx.filter(function (i) { return normName(CV.projects[i].name).indexOf(q) !== -1; });
}

function commonPrefix(list) {

  var m;
  if ((m = v.match(/^(\s*)(\S*)$/))) {
    before = m[1];
    token = m[2].toLowerCase();
    cands = COMMANDS.map(function (c) { return c.name; }).filter(function (n) { return n.indexOf(token) === 0; });
    links = function (list) { return list.map(function (n) { return cmdLink(n, n); }); };
  } else if ((m = v.match(/^(\s*project\s+)(.*)$/i))) {
    before = m[1];
    token = m[2];

    var idxs = [];

    cands = idxs.map(function (i) { return CV.projects[i].name; });

    e.dead = true;
    G.gems.push({ x: e.x, y: e.y, v: e.kind ? 2 : 1, pull: false, dead: false });
    if (!reduced.matches) G.fades.push({ x: e.x, y: e.y, ch: e.ch, c: e.kind ? GC['bug-2'] : GC.bug, life: 0.3 });
  }
}
function hurtBoss(d) {
  var B = G.boss; if (!B) return;
  B.hp -= d; B.flash = 0.06;
  var n = CV.backend_case.before_after.length;
  var reached = B.hp <= 0 ? n : Math.min(n - 1, Math.floor((1 - B.hp / B.max) * n + 1e-6));
  while (G.phase < reached) { printPhase(G.phase); G.phase++; }
  if (B.hp <= 0) {
    G.enemies.forEach(function (e) { if (!reduced.matches) G.fades.push({ x: e.x, y: e.y, ch: e.ch, c: GC.bug, life: 0.3 }); });
    G.enemies = []; G.bullets = []; G.boss = null; G.won = true; G.winT = 1.2;
    G.msg = 'backend.service is down'; G.msgT = 2;
    if (!reduced.matches) G.shake = 5;
  }
}

/* ---------- update (world units, delta time) ---------- */
function update(dt) {
  G.t += dt;
  var P = G.P, i, j, e, s, b;

  if (G.winT > 0) {
    G.winT -= dt;
    if (G.winT <= 0) { finishRun(); return; }
  }

  var mx = 0, my = 0;
  if (gkeys.a || gkeys.arrowleft) mx -= 1;
  if (gkeys.d || gkeys.arrowright) mx += 1;
  if (gkeys.w || gkeys.arrowup) my -= 1;
  if (gkeys.s || gkeys.arrowdown) my += 1;
  if (joy.active) {
    var jx = joy.x - joy.ox, jy = joy.y - joy.oy, jl = Math.hypot(jx, jy);
    if (jl > 6) { var jm = Math.min(jl / 48, 1); mx += jx / jl * jm; my += jy / jl * jm; }
  }
  var ml = Math.hypot(mx, my);
  if (ml > 1) { mx /= ml; my /= ml; }
  P.x = clampN(P.x + mx * 230 * dt, P.r, WW - P.r);
  P.y = clampN(P.y + my * 230 * dt, P.r, WH - P.r);
  if (ml > 0.1) P.facing = Math.atan2(my, mx);

  var areaF = clampN((WW * WH) / (820 * 560), 0.8, 1.3);
  if (!G.won) {
    var maxE = Math.round(40 * areaF);
    var rate = (G.boss ? 0.8 : 1.1 + G.t * 0.03 + (G.level - 1) * 0.22) * areaF;
    G.spawnAcc += rate * dt;
    while (G.spawnAcc >= 1) { G.spawnAcc -= 1; if (G.enemies.length < maxE) spawnEnemy(); }
  }

  P.fire -= dt;
  if (P.fire <= 0) {
    var tg = nearest(P.x, P.y);
    if (tg) { P.fire = 0.5 / (G.ups.rate ? 1.35 : 1); fire(P.x, P.y, tg, G.ups.twin ? 2 : 1); }
    else P.fire = 0;
  }

  if (G.ups.drone) {
    if (!G.drone) G.drone = { x: P.x, y: P.y, fire: 0.4 };
    var D = G.drone;
    var tx = P.x - Math.cos(P.facing) * 30 + Math.cos(G.t * 2) * 8, ty = P.y - Math.sin(P.facing) * 30 + Math.sin(G.t * 2) * 8;
    var kk = 1 - Math.pow(0.002, dt);
    D.x += (tx - D.x) * kk; D.y += (ty - D.y) * kk;
    D.fire -= dt;
    if (D.fire <= 0) { var dt2 = nearest(D.x, D.y); if (dt2) { D.fire = 0.7; fire(D.x, D.y, dt2, 1); } else D.fire = 0; }
  }

  if (G.ups.orbit) {
    P.orbA += dt * 3.2;
    for (var o = 0; o < 2; o++) {
      var oa = P.orbA + o * Math.PI, ox = P.x + Math.cos(oa) * 46, oy = P.y + Math.sin(oa) * 46;
      for (i = 0; i < G.enemies.length; i++) {
        e = G.enemies[i];
        if (e.dead || e.orbCd > 0) continue;
        if (Math.hypot(e.x - ox, e.y - oy) < e.r + 7) { e.orbCd = 0.35; hurtEnemy(e, G.ups.power ? 2 : 1); }
      }
      if (G.boss && G.boss.orbCd <= 0 && bossD2(ox, oy) < 49) { G.boss.orbCd = 0.35; hurtBoss(1); }
    }
  }

  for (i = 0; i < G.shots.length; i++) {
    s = G.shots[i];
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    if (s.life <= 0 || s.x < -20 || s.y < -20 || s.x > WW + 20 || s.y > WH + 20) { s.dead = true; continue; }
    for (j = 0; j < G.enemies.length; j++) {
      e = G.enemies[j];
      if (e.dead || s.hit.indexOf(e) >= 0) continue;
      var ddx = e.x - s.x, ddy = e.y - s.y, rr = e.r + s.r;
      if (ddx * ddx + ddy * ddy < rr * rr) {
        hurtEnemy(e, s.dmg); s.hit.push(e);
        if (s.pierce-- <= 0) { s.dead = true; break; }
      }
    }
    if (!s.dead && G.boss && s.hit.indexOf(G.boss) < 0 && bossD2(s.x, s.y) < s.r * s.r) {
      s.hit.push(G.boss); s.dead = true; hurtBoss(s.dmg);
    }
  }
  G.shots = G.shots.filter(function (x) { return !x.dead; });

  var touching = 0, list = G.enemies;
  for (i = 0; i < list.length; i++) {
    e = list[i];
    if (e.dead) continue;
    e.flash -= dt; e.orbCd -= dt;
    var dx = P.x - e.x, dy = P.y - e.y, d = Math.hypot(dx, dy) || 0.01;
    var a = Math.atan2(dy, dx) + Math.sin(G.t * 3 + e.seed) * 0.35;
    e.x += Math.cos(a) * e.spd * dt; e.y += Math.sin(a) * e.spd * dt;
    var min = P.r + e.r;
    if (d < min) { touching++; e.x = P.x - dx / d * min; e.y = P.y - dy / d * min; }
  }
  for (i = 0; i < list.length; i++) {
    var ea = list[i]; if (ea.dead) continue;
    for (j = i + 1; j < list.length; j++) {
      var eb = list[j]; if (eb.dead) continue;
      var sx = eb.x - ea.x, sy = eb.y - ea.y, sr = ea.r + eb.r, d2 = sx * sx + sy * sy;
      if (d2 < sr * sr && d2 > 0.0001) {
        var sd = Math.sqrt(d2), push = (sr - sd) * 0.5;
        ea.x -= sx / sd * push; ea.y -= sy / sd * push; eb.x += sx / sd * push; eb.y += sy / sd * push;
      }
    }
  }
  G.enemies = list.filter(function (x) { return !x.dead; });

  var dmg = Math.min(touching * 6, 16);
  var B = G.boss;
  if (B) {
    B.flash -= dt; B.orbCd -= dt; B.ring -= dt;
    var bx = P.x - B.x, by = P.y - B.y, bd = Math.hypot(bx, by) || 1;
    var sp = B.y < B.hh + 12 ? 110 : 44;
    B.x += bx / bd * sp * dt; B.y += by / bd * sp * dt;
    B.x = clampN(B.x, B.hw * 0.5, WW - B.hw * 0.5);
    if (bossD2(P.x, P.y) < P.r * P.r) dmg += 14;
    if (B.ring <= 0 && B.y > 0) {
      B.ring = 2.6;
      var n = 10, off = Math.random() * Math.PI;
      for (i = 0; i < n; i++) {
        var ba = off + i * Math.PI * 2 / n;
        G.bullets.push({ x: B.x, y: B.y, vx: Math.cos(ba) * 112, vy: Math.sin(ba) * 112, r: 5, life: 7, dead: false });
      }
    }
  }
  dmg *= dt;
  for (i = 0; i < G.bullets.length; i++) {
    b = G.bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0 || b.x < -20 || b.y < -20 || b.x > WW + 20 || b.y > WH + 20) { b.dead = true; continue; }
    if (Math.hypot(b.x - P.x, b.y - P.y) < b.r + P.r) { b.dead = true; dmg += 7; if (!reduced.matches) G.shake = 2.5; }
  }
  G.bullets = G.bullets.filter(function (x) { return !x.dead; });

  if (P.inv > 0) { P.inv -= dt; dmg = 0; }
  if (dmg > 0) {
    P.hp -= dmg; P.hurtT = 0;
    if (!reduced.matches) G.shake = Math.max(G.shake, 1);
  } else {
    P.hurtT += dt;
    if (P.hurtT > 1.5) P.hp = Math.min(P.maxHp, P.hp + 5 * dt);
  }
  if (P.hp <= 0) {
    /* instant continue: full HP, nearby bugs cleared, level and chapters kept */
    P.hp = P.maxHp; P.hurtT = 9; P.inv = 1.6;
    G.enemies = G.enemies.filter(function (x) { return Math.hypot(x.x - P.x, x.y - P.y) >= 190; });
    G.bullets = [];
    G.msg = 'HP 0 · progress kept · continuing'; G.msgT = 2.2;
  }

  var mag = 115 + (G.level >= 4 ? 35 : 0);
  for (i = 0; i < G.gems.length; i++) {
    var g = G.gems[i];
    var gx = P.x - g.x, gy = P.y - g.y, gd = Math.hypot(gx, gy) || 0.01;
    if (gd < P.r + 7) { g.dead = true; G.xp += g.v; continue; }
    if (g.pull || gd < mag) { g.pull = true; g.x += gx / gd * 380 * dt; g.y += gy / gd * 380 * dt; }
  }
  G.gems = G.gems.filter(function (x) { return !x.dead; });

  for (i = 0; i < G.fades.length; i++) G.fades[i].life -= dt;
  G.fades = G.fades.filter(function (x) { return x.life > 0; });

  if (!G.bossPhase && G.xp >= G.need) {
    G.xp -= G.need; G.level++;
    var ci = G.level - 2;
    G.need = NEEDS[ci + 1] || 999;
    G.ups[CHAPTERS[ci].up] = true;
    G.card = ci;
    if (ci === CHAPTERS.length - 1) { G.bossPhase = true; G.pendingBoss = true; G.xp = 0; }
    G.state = 'card';
    releaseInput();
    printChapter(ci);
  }
}

/* ---------- render: glyphs with fillText, faint dot grid ---------- */
function setFont(size, weight) { gctx.font = (weight || 700) + ' ' + size + 'px ' + MONO; }
function noticeBox(lines) {
  /* lines: [{t, c, b}] drawn centred in screen space on a scrim panel */
  var c = gctx, size = W < 420 ? 12.5 : 14, lh = size * 1.55, i, wmax = 0;
  for (var pass = 0; pass < 2; pass++) {
    wmax = 0;
    for (i = 0; i < lines.length; i++) { setFont(size, lines[i].b ? 700 : 500); wmax = Math.max(wmax, c.measureText(lines[i].t).width); }
    if (wmax <= W - 40 || pass) break;
    size = Math.max(10, size * (W - 40) / wmax); lh = size * 1.55;
  }
  var bw = Math.min(W - 16, wmax + 32), bh = lines.length * lh + 18, x0 = (W - bw) / 2, y0 = (H - bh) / 2;
  c.fillStyle = GC.scrim; c.fillRect(x0, y0, bw, bh);
  c.strokeStyle = GC.line; c.lineWidth = 1; c.strokeRect(x0 + 0.5, y0 + 0.5, bw - 1, bh - 1);
  for (i = 0; i < lines.length; i++) {
    setFont(size, lines[i].b ? 700 : 500);
    c.fillStyle = lines[i].c || GC.fg;
    c.fillText(lines[i].t, W / 2, y0 + 9 + lh * (i + 0.5));
  }
}
function render() {
  if (!W || !G) return;
  var c = gctx, rm = reduced.matches, i;
  c.setTransform(gdpr, 0, 0, gdpr, 0, 0);
  c.fillStyle = GC.bg; c.fillRect(0, 0, W, H);
  var shx = 0, shy = 0;
  if (G.shake > 0 && !rm) { shx = (Math.random() - 0.5) * G.shake * 2; shy = (Math.random() - 0.5) * G.shake * 2; }
  c.setTransform(gdpr * U, 0, 0, gdpr * U, shx * gdpr, shy * gdpr);
  c.textAlign = 'center'; c.textBaseline = 'middle';

  c.fillStyle = GC.grid;
  var gs = 24;
  for (var gx = gs / 2; gx < WW; gx += gs) for (var gy = gs / 2; gy < WH; gy += gs) c.fillRect(gx - 0.8, gy - 0.8, 1.6, 1.6);

  var P = G.P;
  if (P.x === null) return;

  setFont(16);
  c.fillStyle = GC.amber;
  for (i = 0; i < G.gems.length; i++) { var g = G.gems[i]; if (g.v > 1) continue; c.fillText('+', g.x, g.y); }
  setFont(21);
  for (i = 0; i < G.gems.length; i++) { var g2 = G.gems[i]; if (g2.v > 1) c.fillText('+', g2.x, g2.y); }

  for (i = 0; i < G.fades.length; i++) {
    var f = G.fades[i];
    c.globalAlpha = clampN(f.life / 0.3, 0, 1) * 0.6; c.fillStyle = f.c; setFont(19); c.fillText(f.ch, f.x, f.y);
  }
  c.globalAlpha = 1;

  setFont(20);
  for (i = 0; i < G.enemies.length; i++) {
    var e = G.enemies[i];
    if (e.kind) continue;
    c.fillStyle = e.flash > 0 ? GC.fg : GC.bug; c.fillText(e.ch, e.x, e.y);
  }
  setFont(23);
  for (i = 0; i < G.enemies.length; i++) {
    var e2 = G.enemies[i];
    if (!e2.kind) continue;
    c.fillStyle = e2.flash > 0 ? GC.fg : GC['bug-2']; c.fillText(e2.ch, e2.x, e2.y);
  }

  var B = G.boss;
  if (B) {
    c.fillStyle = GC.panel; c.fillRect(B.x - B.hw, B.y - B.hh, B.hw * 2, B.hh * 2);
    c.strokeStyle = B.flash > 0 ? GC.fg : GC['bug-2']; c.lineWidth = 1.5;
    c.strokeRect(B.x - B.hw, B.y - B.hh, B.hw * 2, B.hh * 2);
    setFont(16); c.fillStyle = B.flash > 0 ? GC['bug-2'] : GC.fg; c.fillText('backend.service', B.x, B.y - 9);
    var cells = 12, k = clampN(Math.ceil(B.hp / B.max * cells), 0, cells);
    setFont(14, 500); c.fillStyle = GC['bug-2']; c.fillText('[' + rep('#', k) + rep('-', cells - k) + ']', B.x, B.y + 11);
  }

  setFont(16); c.fillStyle = GC['bug-2'];
  for (i = 0; i < G.bullets.length; i++) c.fillText('•', G.bullets[i].x, G.bullets[i].y);

  c.fillStyle = GC['accent-hi'];
  setFont(G.ups.power ? 21 : 16);
  for (i = 0; i < G.shots.length; i++) c.fillText(G.ups.pierce ? '-' : '*', G.shots[i].x, G.shots[i].y);

  if (G.ups.orbit) {
    setFont(17); c.fillStyle = GC.accent;
    for (var o = 0; o < 2; o++) {
      var oa = P.orbA + o * Math.PI;
      c.fillText('o', P.x + Math.cos(oa) * 46, P.y + Math.sin(oa) * 46);
    }
  }
  if (G.drone) { setFont(18); c.fillStyle = GC.accent; c.fillText('¤', G.drone.x, G.drone.y); }

  var blink = P.inv > 0 ? (rm ? 0.55 : (Math.floor(G.t * 10) % 2 ? 0.35 : 0.9)) : 1;
  c.globalAlpha = blink;
  setFont(25); c.fillStyle = P.hurtT < 0.12 ? GC.err : GC['accent-hi']; c.fillText('@', P.x, P.y);
  c.globalAlpha = 1;

  /* screen-space overlays */
  c.setTransform(gdpr, 0, 0, gdpr, 0, 0);
  c.textAlign = 'center'; c.textBaseline = 'middle';
  if (joy.active) {
    var jx = joy.x - joy.ox, jy = joy.y - joy.oy, jl = Math.hypot(jx, jy), jk = jl > 48 ? 48 / jl : 1;
    c.globalAlpha = 0.5; c.strokeStyle = GC.dim; c.lineWidth = 1.5;
    c.beginPath(); c.arc(joy.ox, joy.oy, 48, 0, Math.PI * 2); c.stroke();
    c.globalAlpha = 0.8; setFont(18); c.fillStyle = GC.accent; c.fillText('+', joy.ox + jx * jk, joy.oy + jy * jk);
    c.globalAlpha = 1;
  }
  if (G.msgT > 0 && G.state === 'play') {
    var ms = W < 420 ? 11.5 : 13;
    setFont(ms, 500);
    var mw = c.measureText(G.msg).width;
    if (mw > W - 24) { ms = Math.max(9, ms * (W - 24) / mw); setFont(ms, 500); mw = c.measureText(G.msg).width; }
    c.globalAlpha = rm ? 1 : clampN(G.msgT / 0.4, 0, 1);
    c.fillStyle = GC.scrim; c.fillRect((W - mw) / 2 - 8, H - 30, mw + 16, 22);
    c.fillStyle = GC.amber; c.fillText(G.msg, W / 2, H - 19);
    c.globalAlpha = 1;
  }
  if (G.state === 'ready') {
    noticeBox([
      { t: G.level > 1 || G.bossPhase ? 'career.run · resumed' : 'career.run', c: GC['accent-hi'], b: true },
      { t: 'move to start: WASD / arrows / drag', c: GC.fg },
      { t: 'Esc or Q quits', c: GC.dim }
    ]);
  } else if (G.state === 'card') {
    var ch = CHAPTERS[G.card];
    noticeBox([
      { t: '[LV ' + (G.card + 2) + '] ' + ch.title, c: GC.amber, b: true },
      { t: 'upgrade: ' + ch.upName, c: GC['accent-hi'] },
      G.pendingBoss ? { t: 'next: boss backend.service', c: GC['bug-2'] } : { t: 'chapter printed above', c: GC.dim },
      { t: 'press Enter or tap to continue', c: GC.fg, b: true }
    ]);
  } else if (G.state === 'paused') {
    noticeBox([
      { t: 'paused', c: GC.amber, b: true },
      { t: 'press Enter or tap to resume', c: GC.fg }
    ]);
  }
}

var lastStatus = '';
function updateStatus(force) {
  if (!G) return;
  var P = G.P, hpN = 8, hpF = clampN(Math.ceil(P.hp / P.maxHp * hpN), 0, hpN);
  var xpL, xpT;
  if (G.bossPhase) {
    var f = G.boss ? G.boss.hp / G.boss.max : (G.won ? 0 : 1), kc = clampN(Math.ceil(f * 10), 0, 10);
    xpL = '  BOSS '; xpT = '[' + rep('#', kc) + rep('-', 10 - kc) + ']';
  } else {
    var xc = clampN(Math.floor(G.xp / G.need * 10), 0, 10);
    xpL = '  XP '; xpT = '[' + rep('#', xc) + rep('-', 10 - xc) + ']';
  }
  var hpT = rep('█', hpF) + rep('░', hpN - hpF), lvT = String(G.level);
  var key = hpT + lvT + xpL + xpT;
  if (!force && key === lastStatus) return;
  lastStatus = key;
  gHp.textContent = hpT; gLv.textContent = lvT; gXpL.textContent = xpL; gXp.textContent = xpT;
}

function frame(now) {
  if (!gameOn) { rafId = 0; return; }
  var dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000));
  lastT = now;
  if (G.state === 'play') update(dt);
  if (!gameOn) { rafId = 0; return; }
  G.shake = Math.max(0, G.shake - dt * 12);
  if (G.msgT > 0 && G.state === 'play') G.msgT -= dt;
  render();
  updateStatus(false);
  rafId = window.requestAnimationFrame(frame);
}

/* ---------- wiring ---------- */
form.addEventListener('submit', function (e) {
  e.preventDefault();
  var v = input.value;
  input.value = '';
  run(v);
});

input.addEventListener('keydown', function (e) {
  if (e.key === 'Tab' && !e.shiftKey && input.value.trim() !== '') {
    e.preventDefault();
    complete();
  } else if (e.key === 'ArrowUp') {
    if (!history.length) return;
    e.preventDefault();
    if (hIndex === history.length) draft = input.value;
    hIndex = Math.max(0, hIndex - 1);
    input.value = history[hIndex];
    moveEnd();
  } else if (e.key === 'ArrowDown') {
    if (hIndex >= history.length) return;
    e.preventDefault();
    hIndex++;
    input.value = hIndex === history.length ? draft : history[hIndex];
    moveEnd();
  } else if ((e.key === 'l' || e.key === 'L') && e.ctrlKey) {
    e.preventDefault();
    run('clear', { record: false });
  }
});
function moveEnd() {
  var n = input.value.length;
  window.requestAnimationFrame(function () { try { input.setSelectionRange(n, n); } catch (e) { /* ignore */ } });
}

chipsEl.appendChild(h('button', { type: 'button', 'class': 'chip play', 'aria-label': 'play: run the career as a game', onclick: function () { run('play'); refocus(); } }, 'play'));
MAIN.concat(['clear']).forEach(function (c) {
  chipsEl.appendChild(h('button', { type: 'button', 'class': 'chip', onclick: function () { run(c); refocus(); } }, c));
});

document.getElementById('term').addEventListener('click', function (e) {
  if (gameOn) {
    if (e.target.closest('a, button, input, .scroll, .gbox')) return;
    var gs = window.getSelection();
    if (gs && String(gs).length) return;
    focusGame();
    return;
  }
  if (!finePointer.matches) return;
  if (e.target.closest('a, button, input, .scroll')) return;
  var sel = window.getSelection();
  if (sel && String(sel).length) return;
  refocus();
});

run('whoami', { record: false, scroll: false, boot: !reduced.matches, intro: true });
refocus();
})();
</script>
